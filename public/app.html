<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de tareas</title>
<style>
body{font-family:system-ui,sans-serif;background:#f0f2f5;margin:0;padding:16px}
nav{max-width:520px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav a{padding:6px 12px;border-radius:8px;background:#fff;color:#2563eb;text-decoration:none}
nav a.router-link-active{background:#2563eb;color:#fff}
.card{max-width:520px;margin:0 auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0002}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin:4px 0}
button.sec{background:#e5e7eb;color:#111}
button.del{background:#fee2e2;color:#b91c1c;margin-left:auto}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
li input{width:auto;margin:0}
li.done span{text-decoration:line-through;color:#888}
.msg{color:#b91c1c}
@media(max-width:480px){body{padding:8px}.card{padding:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue-router@4.5.0/dist/vue-router.global.prod.js"></script>
<script src="app.js"></script>
</body>
</html>
